name: build-apks

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog can diff tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      # Signing: set repo secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD to
      # sign with the release keystore. Without them, builds fall back to
      # debug signing (Play Protect will flag those).
      - name: Materialize signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=expense"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release signing enabled."
          else
            echo "::warning::No signing secrets set - falling back to debug signing."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Without an incrementing version every APK looks like the same
      # build to Android, so installs are offered as a fresh install rather
      # than an update. Derive it from the run number.
      - run: |
          flutter build apk --release --split-per-abi \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            mv "$f" "expense-tracker-${f#app-}"
          done
          ls -la
      - name: Build changelog
        run: |
          PREV=$(git tag -l 'build-*' --sort=-v:refname | head -n 1)
          {
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s' "$PREV"..HEAD
            else
              git log --no-merges --pretty=format:'- %s' -20
            fi
            echo
            echo
            echo "## Downloads"
            echo
            echo "- arm64-v8a - most phones from 2017 onwards, pick this one"
            echo "- armeabi-v7a - older 32-bit phones"
            echo "- x86_64 - emulators"
            echo
            if [ -n "$PREV" ]; then
              echo "Built from ${GITHUB_SHA}. Previous release: ${PREV}."
            else
              echo "Built from ${GITHUB_SHA}."
            fi
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Expense Tracker build ${{ github.run_number }}"
          body_path: CHANGELOG_RELEASE.md
          files: build/app/outputs/flutter-apk/expense-tracker-*.apk
